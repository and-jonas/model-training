# @package _global_

defaults:
  - /model: base
  - /optimization: base
  - /data_augmentation: base
  - /dataset: base
  - /sweep: architecture_comparison
  - override /hydra/launcher: submitit_slurm
  - _self_

task: symptoms
run_name: architecture_comparison
seed: 42
add_predictions: false
fold: null

hydra:
  mode: MULTIRUN
  launcher:
    partition: gpu
    gpus_per_node: 1
    cpus_per_task: 4
    mem_gb: 32
    timeout_min: 600
    array_parallelism: 3